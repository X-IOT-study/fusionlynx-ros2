<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="960" viewBox="0 0 1536 960" role="img" aria-labelledby="title desc">
  <title id="title">FusionLynx system architecture</title>
  <desc id="desc">Vector system architecture for wheel odometry, FAST-LIO, fixed-lag fusion, RTAB-Map, health monitoring and robot TF ownership.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1b5e88"/>
    </marker>
    <marker id="arrow-black" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#25323a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e56d17"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2c8a4b"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#6d767c"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #17232b; }
      .subtitle { font: 400 15px Arial, Helvetica, sans-serif; fill: #67747b; }
      .box-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #17232b; }
      .body { font: 400 14px Arial, Helvetica, sans-serif; fill: #33434b; }
      .small { font: 400 12px Arial, Helvetica, sans-serif; fill: #526169; }
      .topic { font: 700 13px Arial, Helvetica, sans-serif; fill: #20343f; }
      .owner { font: 700 13px Arial, Helvetica, sans-serif; }
      .legend { font: 400 13px Arial, Helvetica, sans-serif; fill: #31434c; }
      .note { font: 400 13px Arial, Helvetica, sans-serif; fill: #34464f; }
      .node { fill: #ffffff; stroke-width: 2; rx: 8; }
      .gray-node { stroke: #647077; }
      .blue-node { stroke: #1b5e88; }
      .orange-node { stroke: #e56d17; }
      .green-node { stroke: #2c8a4b; }
      .purple-node { stroke: #7561a8; }
      .arrow-blue { fill: none; stroke: #1b5e88; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .arrow-black { fill: none; stroke: #25323a; stroke-width: 2.4; marker-end: url(#arrow-black); }
      .arrow-orange { fill: none; stroke: #e56d17; stroke-width: 2.8; marker-end: url(#arrow-orange); }
      .arrow-green { fill: none; stroke: #2c8a4b; stroke-width: 2.8; marker-end: url(#arrow-green); }
      .arrow-health { fill: none; stroke: #6d767c; stroke-width: 1.8; stroke-dasharray: 8 7; marker-end: url(#arrow-gray); }
      .rule { stroke: #d7dfe2; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1536" height="960" fill="#ffffff"/>
  <text x="768" y="42" text-anchor="middle" class="title">FusionLynx system architecture</text>
  <text x="768" y="68" text-anchor="middle" class="subtitle">Sensor streams, estimator ownership and diagnostic feedback</text>

  <!-- Sensor and LIO frontend -->
  <rect x="48" y="112" width="300" height="150" class="node blue-node"/>
  <text x="198" y="145" text-anchor="middle" class="box-title">UniLidar cloud + IMU</text>
  <text x="198" y="178" text-anchor="middle" class="body">3D point cloud</text>
  <text x="198" y="202" text-anchor="middle" class="body">inertial measurements</text>
  <text x="198" y="235" text-anchor="middle" class="small">sensor input</text>

  <rect x="420" y="112" width="300" height="150" class="node blue-node"/>
  <text x="570" y="145" text-anchor="middle" class="box-title">FAST-LIO frontend</text>
  <text x="570" y="178" text-anchor="middle" class="body">LiDAR-inertial odometry</text>
  <text x="570" y="202" text-anchor="middle" class="body">local pose and registered cloud</text>
  <text x="570" y="235" text-anchor="middle" class="small">local frontend; no odom TF ownership</text>

  <path d="M348 168 H420" class="arrow-blue"/>
  <text x="384" y="151" text-anchor="middle" class="topic">/unilidar/cloud</text>
  <path d="M348 215 H420" class="arrow-blue"/>
  <text x="384" y="238" text-anchor="middle" class="topic">/unilidar/imu</text>

  <!-- Wheel pipeline -->
  <rect x="48" y="332" width="300" height="145" class="node gray-node"/>
  <text x="198" y="366" text-anchor="middle" class="box-title">MotionCore hardware</text>
  <text x="198" y="398" text-anchor="middle" class="body">mecanum chassis</text>
  <text x="198" y="422" text-anchor="middle" class="body">IMU + magnetometer</text>
  <text x="198" y="451" text-anchor="middle" class="small">wheel encoder and health evidence</text>

  <rect x="420" y="332" width="230" height="145" class="node gray-node"/>
  <text x="535" y="366" text-anchor="middle" class="box-title">motioncore driver</text>
  <text x="535" y="402" text-anchor="middle" class="body">ROS 2 device interface</text>
  <text x="535" y="431" text-anchor="middle" class="small">hardware data contract</text>

  <rect x="720" y="332" width="270" height="145" class="node gray-node"/>
  <text x="855" y="366" text-anchor="middle" class="box-title">wheel kinematics</text>
  <text x="855" y="402" text-anchor="middle" class="body">mecanum motion model</text>
  <text x="855" y="431" text-anchor="middle" class="small">relative planar motion</text>

  <path d="M348 405 H420" class="arrow-black"/>
  <path d="M650 405 H720" class="arrow-black"/>
  <path d="M990 405 H1050" class="arrow-orange"/>
  <text x="685" y="389" text-anchor="middle" class="topic">/motioncore/wheel_odom</text>

  <!-- Fusion backend -->
  <rect x="1050" y="300" width="360" height="205" class="node orange-node"/>
  <text x="1230" y="338" text-anchor="middle" class="box-title">state_fusion_backend</text>
  <text x="1230" y="367" text-anchor="middle" class="body">Pose3 fixed-lag factor graph</text>
  <rect x="1100" y="390" width="260" height="62" fill="#fff7ef" stroke="#e56d17" stroke-width="1.5" rx="5"/>
  <circle cx="1140" cy="421" r="10" fill="#ffffff" stroke="#e56d17" stroke-width="2"/>
  <circle cx="1210" cy="421" r="10" fill="#ffffff" stroke="#e56d17" stroke-width="2"/>
  <circle cx="1280" cy="421" r="10" fill="#ffffff" stroke="#e56d17" stroke-width="2"/>
  <circle cx="1350" cy="421" r="10" fill="#ffffff" stroke="#e56d17" stroke-width="2"/>
  <path d="M1150 421 H1200 M1220 421 H1270 M1290 421 H1340" stroke="#e56d17" stroke-width="2" fill="none"/>
  <rect x="1110" y="464" width="240" height="25" fill="#fff7ef" stroke="#e56d17" stroke-width="1" rx="4"/>
  <text x="1230" y="482" text-anchor="middle" class="owner" fill="#e56d17">owner of odom -&gt; base_link</text>

  <path d="M720 168 H820 V300 H1050" class="arrow-orange"/>
  <text x="865" y="151" text-anchor="middle" class="topic">/fast_lio/odom</text>

  <!-- Mapping -->
  <rect x="1170" y="112" width="300" height="150" class="node green-node"/>
  <text x="1320" y="145" text-anchor="middle" class="box-title">RTAB-Map</text>
  <text x="1320" y="178" text-anchor="middle" class="body">mapping and global consistency</text>
  <text x="1320" y="202" text-anchor="middle" class="body">consumes fused local odometry</text>
  <rect x="1210" y="224" width="220" height="25" fill="#f1faf3" stroke="#2c8a4b" stroke-width="1" rx="4"/>
  <text x="1320" y="242" text-anchor="middle" class="owner" fill="#2c8a4b">owner of map -&gt; odom</text>

  <path d="M720 205 H900 V95 H1100 V160 H1170" class="arrow-blue"/>
  <text x="948" y="88" text-anchor="middle" class="topic">/fast_lio/cloud_registered_body</text>
  <path d="M1230 300 V280 H1320 V262" class="arrow-green"/>
  <text x="1270" y="278" text-anchor="middle" class="topic">/odom</text>

  <!-- TF publisher -->
  <rect x="1170" y="570" width="300" height="140" class="node purple-node"/>
  <text x="1320" y="604" text-anchor="middle" class="box-title">robot_state_publisher</text>
  <text x="1320" y="638" text-anchor="middle" class="body">URDF / Xacro extrinsics</text>
  <text x="1320" y="666" text-anchor="middle" class="body">static sensor transforms</text>
  <rect x="1210" y="680" width="220" height="25" fill="#f5f1fb" stroke="#7561a8" stroke-width="1" rx="4"/>
  <text x="1320" y="698" text-anchor="middle" class="owner" fill="#7561a8">owner of base_link -&gt; sensors</text>
  <rect x="1170" y="750" width="300" height="50" class="node purple-node"/>
  <text x="1320" y="781" text-anchor="middle" class="box-title" style="font-size:15px;">URDF / Xacro robot description</text>
  <path d="M1320 750 V720" stroke="#6d767c" stroke-width="1.8" stroke-dasharray="8 7"/>
  <path d="M1320 710 L1313 722 L1327 722 Z" fill="#6d767c"/>

  <!-- Health monitor -->
  <rect x="360" y="570" width="560" height="140" class="node gray-node"/>
  <text x="640" y="604" text-anchor="middle" class="box-title">LIO health monitor</text>
  <text x="640" y="635" text-anchor="middle" class="body">innovation / NIS, wheel consistency, IMU consistency</text>
  <text x="640" y="660" text-anchor="middle" class="body">magnetic norm change and timeout</text>
  <rect x="515" y="676" width="250" height="25" fill="#f5f7f8" stroke="#647077" stroke-width="1" rx="4"/>
  <text x="640" y="694" text-anchor="middle" class="owner" fill="#526169">diagnostic input to factor scheduling</text>

  <path d="M198 477 V540 H360 V610" class="arrow-health"/>
  <path d="M535 477 V540 H450 V570" class="arrow-health"/>
  <path d="M855 477 V540 H800 V570" class="arrow-health"/>
  <path d="M1050 452 H965 V640 H920" class="arrow-health"/>
  <text x="955" y="627" text-anchor="end" class="small">LIO factor reliability</text>
  <path d="M920 640 H1010 V505" class="arrow-health"/>
  <text x="1012" y="585" text-anchor="middle" class="small" transform="rotate(-90 1012 585)">health decision</text>

  <!-- Legend and architecture contracts -->
  <line x1="48" y1="765" x2="1488" y2="765" class="rule"/>
  <text x="48" y="799" class="box-title">Interface and ownership contracts</text>
  <text x="48" y="828" class="note">FAST-LIO provides local odometry and registered clouds; it does not publish the integrated odom -&gt; base_link transform.</text>
  <text x="48" y="853" class="note">state_fusion_backend is the single dynamic owner of odom -&gt; base_link and publishes /odom for downstream mapping.</text>
  <text x="48" y="878" class="note">RTAB-Map owns map -&gt; odom; robot_state_publisher owns static base_link -&gt; sensor transforms from URDF / Xacro.</text>
  <text x="48" y="903" class="note">IMU and magnetometer signals enter the health monitor in the current design; they do not directly form localization factors.</text>

  <g transform="translate(1040 792)">
    <line x1="0" y1="0" x2="55" y2="0" class="arrow-blue"/>
    <text x="70" y="5" class="legend">sensor and LIO data</text>
    <line x1="0" y1="28" x2="55" y2="28" class="arrow-black"/>
    <text x="70" y="33" class="legend">wheel odometry</text>
    <line x1="0" y1="56" x2="55" y2="56" class="arrow-orange"/>
    <text x="70" y="61" class="legend">state fusion</text>
    <line x1="0" y1="84" x2="55" y2="84" class="arrow-green"/>
    <text x="70" y="89" class="legend">mapping</text>
    <line x1="0" y1="112" x2="55" y2="112" class="arrow-health"/>
    <text x="70" y="117" class="legend">health monitoring</text>
  </g>
</svg>
